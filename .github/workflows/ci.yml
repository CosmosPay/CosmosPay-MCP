name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the binary
        run: |
          node dist/index.js --version
          if COSMOS_PAY_API_KEY= node dist/index.js 2>err.txt; then echo "expected a failure without a key"; exit 1; fi
          grep -q "COSMOS_PAY_API_KEY is not set" err.txt

      - name: Security audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=low
